<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>虛擬鏡子：對稱偵探社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--card:#FFFFFF;--ink:#1F2A44;--muted:#5B6479;--accent:#E4572E;--teal:#17766A;--line:#E6DCC8;--ok:#1B7F4B;--bad:#C0392B;--chip:#F3EAD7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141A2B;--card:#1D2540;--ink:#F3EEE2;--muted:#B5BCCE;--accent:#FF7A59;--teal:#4CC3B2;--line:#33406B;--ok:#5BD08F;--bad:#FF8A7A;--chip:#26305A}}
:root[data-theme="dark"]{--bg:#141A2B;--card:#1D2540;--ink:#F3EEE2;--muted:#B5BCCE;--accent:#FF7A59;--teal:#4CC3B2;--line:#33406B;--ok:#5BD08F;--bad:#FF8A7A;--chip:#26305A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:20px;line-height:1.5}
header{padding:20px 32px 8px}
h1{margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:900}
h1 span{color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:clamp(16px,1.6vw,22px)}
main{display:flex;flex-wrap:wrap;gap:24px;padding:12px 32px 32px;align-items:flex-start}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px}
.left{flex:0 0 220px;display:flex;flex-direction:column;gap:10px}
.center{flex:1 1 560px;min-width:0}
.right{flex:0 0 300px;display:flex;flex-direction:column;gap:16px}
h2{margin:0 0 8px;font-size:22px;font-weight:700}
button{font-family:inherit;font-size:20px;font-weight:700;color:var(--ink);background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;min-height:48px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.big{background:var(--teal);border-color:var(--teal);color:#FFFFFF;font-size:24px;min-height:60px;width:100%}
.big:hover{border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{flex:1 1 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;cursor:ew-resize;border-radius:16px;background:linear-gradient(var(--card),var(--card))}
.banner{margin-top:12px;min-height:64px;padding:12px 16px;border-radius:16px;font-size:clamp(18px,1.9vw,26px);font-weight:700;border:2px solid var(--line);background:var(--chip)}
.banner.ok{border-color:var(--ok);color:var(--ok)}
.banner.bad{border-color:var(--bad);color:var(--bad)}
.banner.near{border-color:var(--accent);color:var(--accent)}
ol{margin:0;padding-left:1.3em}
li{margin:2px 0}
.log{list-style:none;padding:0;margin:0;font-size:18px}
.log li{padding:6px 10px;border-radius:10px;background:var(--chip);margin:6px 0}
.small{font-size:16px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:17px;color:var(--muted)}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-1px}
@media (max-width:900px){.left,.right{flex:1 1 100%}.left{flex-direction:row;flex-wrap:wrap}.left button{flex:1 1 30%}}

.left{flex:0 0 240px}
#shapes{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding-right:4px}
.grp{margin:8px 0 0;font-size:16px;font-weight:700;color:var(--muted)}
.addbtn{background:var(--chip);border-style:dashed}
.note{font-size:15px;color:var(--muted);margin:4px 0 0}
</style>
</head>
<body>
<header>
<h1>虛擬鏡子 <span>對稱偵探社</span></h1>
<p class="sub">鏡子只照左邊（或上面）的一半。拖動鏡子，找出讓鏡中圖形和原圖「完全疊合」的位置。</p>
</header>
<main>
<aside class="card left" aria-label="選擇圖形">
<h2>① 選案件</h2>
<div id="shapes"></div>
<button id="add" class="addbtn" style="margin-top:8px">＋ 放自己的圖片</button>
<input id="file" type="file" accept="image/*" multiple hidden>
<p class="note">圖片只在你的瀏覽器裡使用，不會上傳；也可以把圖片直接拖進舞台。</p>
<p class="small">先全班舉牌預測「有沒有對稱軸」，再上台驗證。</p>
</aside>
<section class="card center" aria-label="鏡子舞台">
<canvas id="cv" width="1600" height="1200" aria-label="虛擬鏡子舞台：拖動鏡子線觀察鏡射結果"></canvas>
<div class="legend" id="legend"></div>
<div id="banner" class="banner" role="status">把鏡子拖到你覺得對的位置，再按「驗證」。</div>
</section>
<aside class="right">
<div class="card">
<h2>② 擺鏡子</h2>
<div class="row" id="oris"></div>
<div class="row" style="margin-top:8px"><button id="nudgeL" aria-label="鏡子往左或往上微調">◀ 微調</button><button id="nudgeR" aria-label="鏡子往右或往下微調">微調 ▶</button></div>
<div class="row" style="margin-top:8px"><button id="flip">換保留邊</button><button id="ghost" aria-pressed="false">顯示原圖</button></div>
</div>
<div class="card">
<button id="verify" class="big">③ 驗證</button>
<div class="row" style="margin-top:8px"><button id="hint">老師提示</button><button id="reset">重擺</button></div>
</div>
<div class="card">
<h2>鑑定紀錄</h2>
<ul id="log" class="log"><li class="small">還沒有紀錄</li></ul>
<button id="clear" style="margin-top:6px">清除紀錄</button>
</div>
</aside>
</main>

{name:'魚圖②',path:fish2}
];
var NSHAPE=SHAPES.length;
var ORI=[{name:'直的',n:[1,0]},{name:'橫的',n:[0,1]},{name:'斜 ╱',n:[Math.SQRT1_2,Math.SQRT1_2]},{name:'斜 ╲',n:[Math.SQRT1_2,-Math.SQRT1_2]}];
var st={si:0,oi:0,d:0,s:1,ghost:false,res:null,log:[]};
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var banner=document.getElementById('banner'),legend=document.getElementById('legend');
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function cur(){return SHAPES[st.si];}
function N(){return ORI[st.oi].n;}
function dot(n,x,y){return n[0]*x+n[1]*y;}
function rng(oi){var o=cur(),n=ORI[oi===undefined?st.oi:oi].n,x0,x1,y0,y1;if(o.img){var sc=Math.min(560/o.w,520/o.h),w=o.w*sc,h=o.h*sc;x0=CX-w/2;x1=CX+w/2;y0=CY-h/2;y1=CY+h/2;}else{x0=200;x1=600;y0=100;y1=500;}
var v=[dot(n,x0,y0),dot(n,x1,y0),dot(n,x0,y1),dot(n,x1,y1)];return [Math.min.apply(null,v),Math.max.apply(null,v)];}
function clampD(v,oi){var r=rng(oi);return Math.max(r[0],Math.min(r[1],v));}
function resetPos(){st.d=clampD(dot(N(),CX,CY)+80);st.res=null;}
function say(t,c){banner.textContent=t;banner.className='banner'+(c?' '+c:'');}
function setLegend(){if(cur().img){legend.innerHTML='<span>照片模式：由全班一起判斷（照片不一定完全對稱）</span><span><i class="dot" style="background:#D62828"></i>差異較大的地方</span>';}else{legend.innerHTML='<span><i class="dot" style="background:var(--accent)"></i>真的這一半</span><span><i class="dot" style="background:var(--teal)"></i>鏡子裡的那一半</span><span><i class="dot" style="background:#D62828"></i>對不起來的地方</span>';}}
function halfClip(c){var n=N(),m=[n[0]*st.s,n[1]*st.s],t=[-n[1],n[0]],P=[n[0]*st.d,n[1]*st.d],L=3000;
c.beginPath();c.moveTo(P[0]+t[0]*L,P[1]+t[1]*L);c.lineTo(P[0]-t[0]*L,P[1]-t[1]*L);c.lineTo(P[0]-t[0]*L-m[0]*L,P[1]-t[1]*L-m[1]*L);c.lineTo(P[0]+t[0]*L-m[0]*L,P[1]+t[1]*L-m[1]*L);c.closePath();c.clip();}
function putObj(c,col){var o=cur();if(o.img){var s=Math.min(560/o.w,520/o.h),w=o.w*s,h=o.h*s;c.drawImage(o.img,CX-w/2,CY-h/2,w,h);}else{c.translate(200,100);c.fillStyle=col;c.fill(o.path);}}
function paintOrig(c,col){c.save();putObj(c,col);c.restore();}
function paintComp(c,c1,c2){var n=N(),nx=n[0],ny=n[1],d=st.d;
c.save();halfClip(c);putObj(c,c1);c.restore();
c.save();c.transform(1-2*nx*nx,-2*nx*ny,-2*nx*ny,1-2*ny*ny,2*d*nx,2*d*ny);halfClip(c);putObj(c,c2);c.restore();}
var cA=document.createElement('canvas'),cB=document.createElement('canvas'),cR=document.createElement('canvas');
function render(c,k,fn){c.width=Math.round(2000*k);c.height=Math.round(1800*k);var x=c.getContext('2d',{willReadFrequently:true});x.scale(k,k);x.translate(600,500);fn(x);return x.getImageData(0,0,c.width,c.height);}
function white(x){x.save();x.fillStyle='#fff';x.fillRect(-2000,-2000,6000,6000);x.restore();}
function imgRect(){var o=cur(),sc=Math.min(560/o.w,520/o.h),w=o.w*sc,h=o.h*sc;return [CX-w/2,CY-h/2,w,h];}
function score(k,wantMap){var img=!!cur().img;
if(!img){var A0=render(cA,k,function(x){paintOrig(x,'#000');}).data,B0=render(cB,k,function(x){paintComp(x,'#000','#000');}).data,i0=0,u0=0;
for(var p=0;p<A0.length;p+=4){var ea=A0[p+3]>128,eb=B0[p+3]>128;if(!ea&&!eb)continue;u0++;if(ea&&eb)i0++;}return {v:u0?i0/u0:0};}
var rc=imgRect(),n=N(),nx=n[0],ny=n[1],d=st.d,s=st.s;
var AI=render(cA,k,function(x){white(x);paintOrig(x,'#000');}),BI=render(cB,k,function(x){white(x);paintComp(x,'#000','#000');});
var Rm=render(cR,k,function(x){x.transform(1-2*nx*nx,-2*nx*ny,-2*nx*ny,1-2*ny*ny,2*d*nx,2*d*ny);x.fillStyle='#000';x.fillRect(rc[0],rc[1],rc[2],rc[3]);}).data;
var a=AI.data,b=BI.data,wid=AI.width,hgt=AI.height,nk=0,cnt=0,sA=0,sB=0,sAA=0,sBB=0,sAB=0,map=wantMap?new ImageData(wid,hgt):null;
for(var yy=0;yy<hgt;yy++){var wy=yy/k-500;for(var xx=0;xx<wid;xx++){var wx=xx/k-600;
if(s*(nx*wx+ny*wy-d)<=0)continue;
if(wx<rc[0]||wx>rc[0]+rc[2]||wy<rc[1]||wy>rc[1]+rc[3])continue;nk++;
var q=(yy*wid+xx)*4;if(Rm[q+3]<=128)continue;cnt++;
var ga=(a[q]+a[q+1]+a[q+2])/3,gb=(b[q]+b[q+1]+b[q+2])/3;sA+=ga;sB+=gb;sAA+=ga*ga;sBB+=gb*gb;sAB+=ga*gb;
if(map&&Math.abs(ga-gb)>60){map.data[q]=214;map.data[q+1]=40;map.data[q+2]=40;map.data[q+3]=170;}}}
var cov=nk?cnt/nk:0,area=rc[2]*rc[3]*k*k,ncc=0;
if(cnt>10){var va=cnt*sAA-sA*sA,vb=cnt*sBB-sB*sB;if(va>1e-6&&vb>1e-6)ncc=(cnt*sAB-sA*sB)/Math.sqrt(va*vb);}
return {v:Math.max(0,ncc)*Math.min(1,cov/.5)*Math.min(1,cnt/(.2*area)),cov:cov,map:map,w:wid,h:hgt};}
var TOL=150;
function THR(){return cur().img?{ok:OKI,near:NEARI}:{ok:.975,near:.93};}
var OKI=.85,NEARI=.7;
var lastMap=null;
function draw(){
var dpr=cv.width/W;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
var acc=css('--accent'),teal=css('--teal'),ink=css('--ink'),img=!!cur().img;
if(st.ghost){ctx.save();ctx.globalAlpha=img?.3:.16;paintOrig(ctx,ink);ctx.restore();}
paintComp(ctx,acc,teal);
if(st.res&&!st.res.ok){
if(img){if(st.res.map){var sm=document.createElement('canvas');sm.width=st.res.map.width;sm.height=st.res.map.height;sm.getContext('2d').putImageData(st.res.map,0,0);ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(sm,-600,-500,2000,1800);ctx.restore();}}
else{var t1=document.createElement('canvas');t1.width=cv.width;t1.height=cv.height;var x1=t1.getContext('2d');x1.scale(dpr,dpr);paintOrig(x1,'#D62828');x1.globalCompositeOperation='destination-out';paintComp(x1,'#000','#000');
var t2=document.createElement('canvas');t2.width=cv.width;t2.height=cv.height;var x2=t2.getContext('2d');x2.scale(dpr,dpr);paintComp(x2,'#F4A261','#F4A261');x2.globalCompositeOperation='destination-out';paintOrig(x2,'#000');
ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=.9;ctx.drawImage(t1,0,0);ctx.globalAlpha=.7;ctx.drawImage(t2,0,0);ctx.restore();}}
var n=N(),t=[-n[1],n[0]],d=st.d,k=d-dot(n,CX,CY),hc=[CX+n[0]*k,CY+n[1]*k];
ctx.save();ctx.lineCap='round';ctx.strokeStyle='rgba(110,185,230,.45)';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(hc[0]-t[0]*1200,hc[1]-t[1]*1200);ctx.lineTo(hc[0]+t[0]*1200,hc[1]+t[1]*1200);ctx.stroke();
ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=3;ctx.setLineDash([14,10]);ctx.stroke();
ctx.setLineDash([]);ctx.fillStyle=ink;ctx.beginPath();ctx.arc(hc[0],hc[1],20,0,Math.PI*2);ctx.fill();
ctx.fillStyle=css('--card');ctx.font='700 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⇔',hc[0],hc[1]+1);ctx.restore();
cv.style.cursor=(st.oi===0?'ew-resize':st.oi===1?'ns-resize':'move');
}
var MSG0='把鏡子拖到你覺得對的位置，再按「驗證」。';
function move(v){st.d=clampD(v);st.res=null;say(MSG0);draw();}
function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
var down=false;
cv.addEventListener('pointerdown',function(e){down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);move(dot(N(),p[0],p[1]));});
cv.addEventListener('pointermove',function(e){if(!down)return;var p=pt(e);move(dot(N(),p[0],p[1]));});
cv.addEventListener('pointerup',function(){down=false;});
cv.addEventListener('pointercancel',function(){down=false;});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowUp'){move(st.d-2);e.preventDefault();}if(e.key==='ArrowRight'||e.key==='ArrowDown'){move(st.d+2);e.preventDefault();}});
document.getElementById('nudgeL').onclick=function(){move(st.d-2);};
document.getElementById('nudgeR').onclick=function(){move(st.d+2);};
document.getElementById('flip').onclick=function(){st.s=-st.s;st.res=null;say('換成鏡子照另一邊。');draw();};
var gb=document.getElementById('ghost');gb.onclick=function(){st.ghost=!st.ghost;gb.setAttribute('aria-pressed',st.ghost);draw();};
function addLog(txt){if(st.log.indexOf(txt)>=0)return;st.log.unshift(txt);st.log=st.log.slice(0,8);renderLog();}
function renderLog(){var ul=document.getElementById('log');ul.innerHTML='';if(!st.log.length){var li=document.createElement('li');li.className='small';li.textContent='還沒有紀錄';ul.appendChild(li);return;}st.log.forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li);});}
document.getElementById('clear').onclick=function(){st.log=[];renderLog();};
document.getElementById('verify').onclick=function(){if(cur().img){var ri=score(.3,true);st.res={ok:false,map:ri.map};say('照片模式：紅色是兩邊差異較大的地方。請和同學一起判斷：這張照片算不算「完全疊合」？','near');draw();return;}
var r=score(.3,true),v=r.v,th=THR(),nm=cur().name+'｜'+ORI[st.oi].name+'鏡子';
if(v>=th.ok){st.res={ok:true};say('✅ 完全疊合！這條鏡子線就是對稱軸，'+cur().name+'是線對稱圖形。','ok');addLog(nm+'　✓ 對稱軸');}
else if(v>=th.near){st.res={ok:false,map:r.map};say('差一點點！再用「微調」移一移。紅色是還對不起來的地方。','near');}
else{st.res={ok:false,map:r.map};say('❌ 對不起來：紅色、橘色是和原圖不一樣的地方。換個位置或方向試試看。','bad');addLog(nm+'　✗ 不是對稱軸');}
draw();};
document.getElementById('reset').onclick=function(){resetPos();say(MSG0);draw();};
function bestD(oi){var save=st.oi;st.oi=oi;var R=rng(oi),b={v:-1,d:(R[0]+R[1])/2};
for(var d=R[0];d<=R[1];d+=4){st.d=d;var r=score(.12).v;if(r>b.v)b={v:r,d:d};}
var c0=b.d,b2={v:-1,d:c0};for(var d2=c0-4;d2<=c0+4;d2++){st.d=clampD(d2,oi);var r2=score(.3).v;if(r2>b2.v)b2={v:r2,d:st.d};}
st.oi=save;return b2;}
document.getElementById('hint').onclick=function(){var o=cur();
if(o.img){if(o.axis){var rc=imgRect();st.oi=o.axis.oi;st.s=1;st.d=o.axis.oi===0?rc[0]+o.axis.f*rc[2]:rc[1]+o.axis.f*rc[3];st.res=null;buildOris();say('提示：對稱軸大約在這裡（照片通常不會完全一樣）。請觀察兩邊哪裡相同、哪裡不同。');}
else if(o.axis===null){say('提示：直、橫、斜的鏡子都對不起來。請說說為什麼（例如顏色或形狀會對調）。');}
else{say('這是你放的圖片，沒有內建答案，請老師和學生一起判斷。');}
draw();return;}
say('老師提示：正在尋找對稱軸……');setTimeout(function(){
var o0=st.oi,d0=st.d,th=THR(),order=[o0].concat([0,1,2,3].filter(function(x){return x!==o0;})),found=null;
for(var i=0;i<order.length&&!found;i++){var r=bestD(order[i]);if(r.v>=th.ok-.01)found={oi:order[i],d:r.d};}
st.oi=o0;st.d=d0;
if(found){st.oi=found.oi;st.d=found.d;st.s=1;st.res=null;buildOris();say('提示：把「'+ORI[st.oi].name+'」鏡子放在這裡就能疊合。再按「驗證」確認。');}
else{say('提示：直、橫、斜四種鏡子都找不到能完全疊合的位置，所以不是線對稱圖形。請說說為什麼。');}
draw();},30);};
function buildShapes(){var box=document.getElementById('shapes');box.innerHTML='';
function head(t){var p=document.createElement('p');p.className='grp';p.textContent=t;box.appendChild(p);}
SHAPES.forEach(function(s,i){if(i===0)head('圖形');if(i===NSHAPE)head('照片與我的圖片');
var b=document.createElement('button');b.textContent=s.name;b.setAttribute('aria-pressed',i===st.si);b.onclick=function(){st.si=i;st.oi=0;st.s=1;resetPos();buildShapes();buildOris();setLegend();say(MSG0);draw();};box.appendChild(b);});}
function buildOris(){var box=document.getElementById('oris');box.innerHTML='';ORI.forEach(function(o,i){var b=document.createElement('button');b.textContent=o.name;b.setAttribute('aria-pressed',i===st.oi);b.onclick=function(){st.oi=i;resetPos();buildOris();say(MSG0);draw();};box.appendChild(b);});}
function toCanvas(im){var s=Math.min(1,1200/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.naturalWidth||im.width)*s));c.height=Math.max(1,Math.round((im.naturalHeight||im.height)*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c;}
function addImage(name,src,select,axis){var im=new Image();im.onload=function(){var c=toCanvas(im);var ob={name:name,img:c,w:c.width,h:c.height};if(axis!==undefined)ob.axis=axis;SHAPES.push(ob);if(select){st.si=SHAPES.length-1;st.oi=0;st.s=1;resetPos();setLegend();say(MSG0);}buildShapes();draw();};im.onerror=function(){say('這張圖片無法開啟，請換一張。','bad');};im.src=src;}
function loadFiles(files){Array.prototype.forEach.call(files,function(f,i){if(!/^image\//.test(f.type))return;var r=new FileReader();r.onload=function(){var nm=f.name.replace(/\.[^.]+$/,'');if(nm.length>8)nm=nm.slice(0,8)+'…';addImage('我的：'+nm,r.result,true);};r.readAsDataURL(f);});}
var fi=document.getElementById('file');document.getElementById('add').onclick=function(){fi.click();};
fi.onchange=function(){loadFiles(fi.files);fi.value='';};
cv.addEventListener('dragover',function(e){e.preventDefault();});
cv.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files)loadFiles(e.dataTransfer.files);});
var AX={'教堂':{oi:0,f:.5},'鐵塔':{oi:0,f:.5},'圓拱橋':{oi:1,f:.545},'蝴蝶照':{oi:0,f:.5},'臺鐵局徽':{oi:0,f:.5},'太極圖':null};
BUILTIN.forEach(function(b){addImage(b[0],b[1],false,AX.hasOwnProperty(b[0])?AX[b[0]]:undefined);});
buildShapes();buildOris();resetPos();setLegend();draw();

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
})();
</script>
